name: Versioned Release

# 推送 v* 格式的 tag 时触发, 构建正式版本 Release
on:
  push:
    tags:
      - "v*"

permissions: write-all

jobs:
  release:
    name: Release

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v5
        with:
          path: "./HugoAura-Code"

      - name: Build artifacts
        run: |
          echo "[DEBUG] Creating artifacts directory"
          mkdir -p Artifacts
          cd ./HugoAura-Code/src/aura
          zip -r ../../../Artifacts/aura.zip .
          cd ../core
          zip -r ../../../Artifacts/core.zip .
          cd ../../..

          echo "[DEBUG] Files in <Working DIR>/Artifacts directory:"
          ls -la Artifacts/

      - name: Get tag & commit info
        run: |
          cd ./HugoAura-Code
          TAG_NAME=${GITHUB_REF#refs/tags/}
          SHORT_HASH=$(git rev-parse --short=7 HEAD)
          FULL_HASH=$(git rev-parse HEAD)
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV
          echo "SHORT_HASH=$SHORT_HASH" >> $GITHUB_ENV
          echo "FULL_HASH=$FULL_HASH" >> $GITHUB_ENV
          echo "BUILDTIME=$(TZ=Asia/Shanghai date)" >> $GITHUB_ENV

      - name: Create release content
        run: |
          cd ./HugoAura-Code

          # 版本类型由 tag 决定: 带 rc / beta / alpha / pre 视为预发布, 否则为正式版
          case "${TAG_NAME}" in
            *-rc*|*-beta*|*-alpha*|*-pre*) RELEASE_TYPE="🧪 预发布版 (Pre-release)" ;;
            *) RELEASE_TYPE="✅ 正式版 (Stable Release)" ;;
          esac

          # 找上一个 tag (按创建时间排序, 排除当前 tag)
          # 必须排除 pack.yml 产生的 vAutoBuild-<hash>: 它们数量远超正式版本 tag,
          # 若不过滤, 这里会选中最近一次 CI 构建, 导致更新日志只剩几条甚至为空。
          PREV_TAG=$(git tag --sort=-creatordate | grep -v "^${TAG_NAME}$" | grep -v "^vAutoBuild" | head -n 1 || true)

          # 按 commit message 前缀分类生成更新日志
          FEAT_LINES=""
          FIX_LINES=""
          CHORE_LINES=""
          SEC_LINES=""
          OTHER_LINES=""

          while IFS= read -r subject; do
            [ -z "$subject" ] && continue
            case "$subject" in Merge\ *) continue ;; esac

            # 只取行首 [..] 前缀做类型判定; 各类型独立判断而非 case 单次匹配,
            # 因此组合类型 (如 [🛠️ Fix / 🔄 Chore]) 会同时进入对应的多个章节。
            if [[ "$subject" == \[*\]* ]]; then
              PREFIX="${subject%%]*}"
              if [[ "$PREFIX" == *"Feat"* ]]; then FEAT_LINES="${FEAT_LINES}- ${subject}\n"; fi
              if [[ "$PREFIX" == *"Fix"* ]]; then FIX_LINES="${FIX_LINES}- ${subject}\n"; fi
              if [[ "$PREFIX" == *"Security"* ]]; then SEC_LINES="${SEC_LINES}- ${subject}\n"; fi
              if [[ "$PREFIX" == *"Chore"* || "$PREFIX" == *"Docs"* ]]; then CHORE_LINES="${CHORE_LINES}- ${subject}\n"; fi
              if [[ "$PREFIX" != *"Feat"* && "$PREFIX" != *"Fix"* && "$PREFIX" != *"Security"* && "$PREFIX" != *"Chore"* && "$PREFIX" != *"Docs"* ]]; then
                OTHER_LINES="${OTHER_LINES}- ${subject}\n"
              fi
            else
              OTHER_LINES="${OTHER_LINES}- ${subject}\n"
            fi
          done < <(git log --pretty=format:"%s" ${PREV_TAG:+"$PREV_TAG..HEAD"} 2>/dev/null)

          cat > "$GITHUB_WORKSPACE/rel_msg.txt" << EOF
          # HugoAura Enhanced 新版本已发布

          **版本类型：${RELEASE_TYPE}**

          **版本号：** \`${TAG_NAME}\`

          > [!注意]
          > 如果您在最新版管家 (v1.6.7.4010) 上安装时遇到问题，请务必确认您使用的是否为 v0.0.3-beta-III 或更高版本的 HugoAura Enhanced 安装器。
          >安装器下载链接:https://github.com/blingbling-bow/HugoAura-Enhanced-Install/releases

          # 更新日志 / Changelog

          **从 \`${PREV_TAG:-仓库初始}\` 之后**

          ## ${TAG_NAME}

          EOF

          add_section() {
            local title="$1" lines="$2"
            if [ -n "$lines" ]; then
              echo "" >> "$GITHUB_WORKSPACE/rel_msg.txt"
              echo "### $title" >> "$GITHUB_WORKSPACE/rel_msg.txt"
              echo "" >> "$GITHUB_WORKSPACE/rel_msg.txt"
              echo -e "$lines" >> "$GITHUB_WORKSPACE/rel_msg.txt"
            fi
          }

          add_section "✨ Feat / 新增" "$FEAT_LINES"
          add_section "🛠 Fix / 修复" "$FIX_LINES"
          add_section "🔐 Security / 安全" "$SEC_LINES"
          add_section "🔄 Chore / 杂项 & Docs / 文档" "$CHORE_LINES"
          add_section "📝 Other / 其他" "$OTHER_LINES"

          cat >> "$GITHUB_WORKSPACE/rel_msg.txt" << EOF

          # Version alignment / 版本对齐信息

          **此 Release 发布时对齐的 Commit：** \`$SHORT_HASH\`

          **此 Release 对齐的希沃管家版本：** \`v1.6.7.4010\`

          **🕘 构建时间： $BUILDTIME**

          ---

          **完整更新日志：** \`https://github.com/${{ github.repository }}/compare/${PREV_TAG:-""}...$TAG_NAME\`

          **如果您使用此版本发现了问题，请将此问题反馈至 Issues，并附上图片或复现步骤**
          EOF

          echo "[DEBUG] Generated release notes:"
          cat "$GITHUB_WORKSPACE/rel_msg.txt"

      - name: Upload aura.zip
        uses: actions/upload-artifact@v7
        with:
          name: aura-code
          path: Artifacts/aura.zip

      - name: Upload core.zip
        uses: actions/upload-artifact@v7
        with:
          name: aura-core
          path: Artifacts/core.zip

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ env.TAG_NAME }}" \
            "$GITHUB_WORKSPACE/Artifacts/aura.zip" \
            "$GITHUB_WORKSPACE/Artifacts/core.zip" \
            --title "[Rel]${{ env.TAG_NAME }}" \
            --notes-file "$GITHUB_WORKSPACE/rel_msg.txt" \
            --repo ${{ github.repository }} \
            --latest
