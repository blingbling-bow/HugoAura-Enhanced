name: Versioned Release

# 推送 v* 格式的 tag 时触发, 构建正式版本 Release
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Release

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v5
        with:
          path: "./HugoAura-Code"
          # 生成"完整更新日志"的 compare 链接需要全部 tag: checkout 默认 fetch-depth=1
          # 且不拉取 tag, 会导致 PREV_TAG 取不到、链接退化成坏地址 (v0.3.0 即因此出错)。
          fetch-depth: 0

      - name: Build artifacts
        run: |
          echo "[DEBUG] Creating artifacts directory"
          mkdir -p Artifacts
          cd ./HugoAura-Code/src/aura
          zip -r ../../../Artifacts/aura.zip .
          cd ../core
          zip -r ../../../Artifacts/core.zip .
          cd ../../..

          echo "[DEBUG] Files in <Working DIR>/Artifacts directory:"
          ls -la Artifacts/

      - name: Get tag & commit info
        run: |
          cd ./HugoAura-Code
          TAG_NAME=${GITHUB_REF#refs/tags/}
          SHORT_HASH=$(git rev-parse --short=7 HEAD)
          FULL_HASH=$(git rev-parse HEAD)
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV
          echo "SHORT_HASH=$SHORT_HASH" >> $GITHUB_ENV
          echo "FULL_HASH=$FULL_HASH" >> $GITHUB_ENV
          echo "BUILDTIME=$(TZ=Asia/Shanghai date)" >> $GITHUB_ENV

      - name: Create release content
        run: |
          cd ./HugoAura-Code

          # 版本类型由 tag 决定: 带 rc / beta / alpha / pre 视为预发布, 否则为正式版
          case "${TAG_NAME}" in
            *-rc*|*-beta*|*-alpha*|*-pre*) RELEASE_TYPE="🧪 预发布版 (Pre-release)" ;;
            *) RELEASE_TYPE="✅ 正式版 (Stable Release)" ;;
          esac

          # 上一版本 tag (按创建时间排序, 排除当前 tag): 用于生成"完整更新日志"的 compare 链接。
          # 只接受 v<数字>.<数字>.<数字> 形式的版本 tag: pack.yml 产生的
          # vAutoBuild-<hash> 数量远超正式版本 tag, 不过滤会选中最近一次 CI 构建。
          PREV_TAG=$(git tag --sort=-creatordate | grep -E "^v[0-9]+\.[0-9]+\.[0-9]+" | grep -v "^${TAG_NAME}$" | head -n 1 || true)

          # 自动生成更新日志: 上一版本 tag 之后的所有提交标题, 按提交类型分组
          # (提交标题遵循 [emoji 类型] 描述 约定)。
          # 注意两处过滤:
          #   1. 用 git commit -F 提交时标题可能带 UTF-8 BOM, 先剥掉再分组,
          #      否则 "^\[✨" 这类锚定正则全部匹配不上 (v0.3.1 即因此把
          #      新增项错分到「其它变更」);
          #   2. 版本发布准备提交 ([🚀 Release]) 属于流程性提交, 不进更新日志。
          COMMITS=$(git log --format="%s" ${PREV_TAG:+$PREV_TAG..}HEAD \
            | sed 's/^\xEF\xBB\xBF//' \
            | grep -v "^\[🚀 Release\]" || true)
          group() {
            echo "$COMMITS" | grep -E "$1" | sed -E "s/^\[[^]]+\] +//" | sed "s/^/- /" || true
          }
          FEAT_LIST=$(group "^\[(✨|feat)")
          FIX_LIST=$(group "^\[(🛠|🐞|fix)")
          STYLE_LIST=$(group "^\[(🎨|style)")
          CHORE_LIST=$(group "^\[(🔄|chore|📝|⬆|🔧)")
          OTHER_LIST=$(echo "$COMMITS" | grep -vE "^\[(✨|🛠|🐞|🎨|🔄|📝|⬆|🔧|feat|fix|chore|style)" | sed "s/^/- /" || true)

          CHANGELOG=""
          if [ -n "$FEAT_LIST" ]; then
            CHANGELOG="${CHANGELOG}
          ## ✨ 新增 / Features

          ${FEAT_LIST}"
          fi
          if [ -n "$FIX_LIST" ]; then
            CHANGELOG="${CHANGELOG}

          ## 🛠 修复 / Fixes

          ${FIX_LIST}"
          fi
          if [ -n "$STYLE_LIST" ]; then
            CHANGELOG="${CHANGELOG}

          ## 🎨 界面 / UI

          ${STYLE_LIST}"
          fi
          if [ -n "$CHORE_LIST" ]; then
            CHANGELOG="${CHANGELOG}

          ## 🔄 其它 / Chores

          ${CHORE_LIST}"
          fi
          if [ -n "$OTHER_LIST" ]; then
            CHANGELOG="${CHANGELOG}

          ### 其它变更

          ${OTHER_LIST}"
          fi

          # compare 链接: 找不到前置 tag 时会退化, 改用提交列表页
          if [ -n "$PREV_TAG" ]; then
            FULL_CHANGELOG="https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${TAG_NAME}"
          else
            FULL_CHANGELOG="https://github.com/${{ github.repository }}/commits/${TAG_NAME}"
          fi

          cat > "$GITHUB_WORKSPACE/rel_msg.txt" << EOF
          # HugoAura Enhanced 新版本已发布

          **版本类型：${RELEASE_TYPE}**

          **版本号：** \`${TAG_NAME}\`

          > [!注意]
          > 如果您在最新版管家 (v1.6.7.4018) 上安装时遇到问题，请务必确认您使用的是否为 v0.0.3-beta-III 或更高版本的 HugoAura Enhanced 安装器。
          > 安装器下载链接: https://github.com/blingbling-bow/HugoAura-Enhanced-Install/releases

          # 更新日志 / Changelog

          **从 \`${PREV_TAG:-仓库初始}\` 之后**

          ## ${TAG_NAME}
          ${CHANGELOG}

          # Version alignment / 版本对齐信息

          **此 Release 发布时对齐的 Commit：** \`$SHORT_HASH\`

          **此 Release 对齐的希沃管家版本：** \`v1.6.7.4018\`

          **🕘 构建时间： $BUILDTIME**

          ---

          **完整更新日志：** \`${FULL_CHANGELOG}\`

          **如果您使用此版本发现了问题，请将此问题反馈至 Issues，并附上图片或复现步骤**
          EOF

          echo "[DEBUG] Generated release notes:"
          cat "$GITHUB_WORKSPACE/rel_msg.txt"

      - name: Upload aura.zip
        uses: actions/upload-artifact@v7
        with:
          name: aura-code
          path: Artifacts/aura.zip

      - name: Upload core.zip
        uses: actions/upload-artifact@v7
        with:
          name: aura-core
          path: Artifacts/core.zip

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ env.TAG_NAME }}" \
            "$GITHUB_WORKSPACE/Artifacts/aura.zip" \
            "$GITHUB_WORKSPACE/Artifacts/core.zip" \
            --title "[Rel]${{ env.TAG_NAME }}" \
            --notes-file "$GITHUB_WORKSPACE/rel_msg.txt" \
            --repo ${{ github.repository }} \
            --latest

      # 用 GITHUB_TOKEN 创建的 Release 不会再触发其它 workflow (GitHub 防递归),
      # 因此 trigger-install-upd.yml 的 release:published 收不到事件 —— v0.3.1
      # 就没有通知到 installer 仓库。这里用 PAT 显式补一次 repository dispatch。
      - name: Notify installer repo
        env:
          INSTALL_PAT: ${{ secrets.AURA_INSTALL_REPO_PAT }}
        run: |
          if [ -z "$INSTALL_PAT" ]; then
            echo "::warning::未配置 AURA_INSTALL_REPO_PAT, 跳过 installer 通知"
            exit 0
          fi
          curl -sS -o /dev/null -w "HTTP %{http_code}\n" -X POST \
            -H "Authorization: Bearer ${INSTALL_PAT}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/blingbling-bow/HugoAura-Enhanced-Install/dispatches" \
            -d "{\"event_type\":\"hugoaura_rel\",\"client_payload\":{\"tag_name\":\"${TAG_NAME}\",\"release_name\":\"[Rel]${TAG_NAME}\",\"release_url\":\"https://github.com/${{ github.repository }}/releases/tag/${TAG_NAME}\",\"repository\":\"${{ github.repository }}\"}}"
