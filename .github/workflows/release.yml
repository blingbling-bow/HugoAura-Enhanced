name: Versioned Release

# 推送 v* 格式的 tag 时触发, 构建正式版本 Release
on:
  push:
    tags:
      - "v*"

permissions: write-all

jobs:
  release:
    name: Release

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v5
        with:
          path: "./HugoAura-Code"
          # 生成"完整更新日志"的 compare 链接需要全部 tag: checkout 默认 fetch-depth=1
          # 且不拉取 tag, 会导致 PREV_TAG 取不到、链接退化成坏地址 (v0.3.0 即因此出错)。
          fetch-depth: 0

      - name: Build artifacts
        run: |
          echo "[DEBUG] Creating artifacts directory"
          mkdir -p Artifacts
          cd ./HugoAura-Code/src/aura
          zip -r ../../../Artifacts/aura.zip .
          cd ../core
          zip -r ../../../Artifacts/core.zip .
          cd ../../..

          echo "[DEBUG] Files in <Working DIR>/Artifacts directory:"
          ls -la Artifacts/

      - name: Get tag & commit info
        run: |
          cd ./HugoAura-Code
          TAG_NAME=${GITHUB_REF#refs/tags/}
          SHORT_HASH=$(git rev-parse --short=7 HEAD)
          FULL_HASH=$(git rev-parse HEAD)
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV
          echo "SHORT_HASH=$SHORT_HASH" >> $GITHUB_ENV
          echo "FULL_HASH=$FULL_HASH" >> $GITHUB_ENV
          echo "BUILDTIME=$(TZ=Asia/Shanghai date)" >> $GITHUB_ENV

      - name: Create release content
        run: |
          cd ./HugoAura-Code

          # 版本类型由 tag 决定: 带 rc / beta / alpha / pre 视为预发布, 否则为正式版
          case "${TAG_NAME}" in
            *-rc*|*-beta*|*-alpha*|*-pre*) RELEASE_TYPE="🧪 预发布版 (Pre-release)" ;;
            *) RELEASE_TYPE="✅ 正式版 (Stable Release)" ;;
          esac

          # 找上一个 tag (按创建时间排序, 排除当前 tag), 用于生成"完整更新日志"的 compare 链接。
          # 只接受 v<数字>.<数字>.<数字> 形式的版本 tag: pack.yml 产生的
          # vAutoBuild-<hash> 数量远超正式版本 tag, 不过滤会选中最近一次 CI 构建,
          # 使 compare 范围缩成一次构建; 该正则同时也排除任何非版本标记 tag。
          PREV_TAG=$(git tag --sort=-creatordate | grep -E "^v[0-9]+\.[0-9]+\.[0-9]+" | grep -v "^${TAG_NAME}$" | head -n 1 || true)

          cat > "$GITHUB_WORKSPACE/rel_msg.txt" << EOF
          # HugoAura Enhanced 新版本已发布

          **版本类型：${RELEASE_TYPE}**

          **版本号：** \`${TAG_NAME}\`

          > [!注意]
          > 如果您在最新版管家 (v1.6.7.4010) 上安装时遇到问题，请务必确认您使用的是否为 v0.0.3-beta-III 或更高版本的 HugoAura Enhanced 安装器。
          >安装器下载链接:https://github.com/blingbling-bow/HugoAura-Enhanced-Install/releases

          # 更新日志 / Changelog

          **从 \`${PREV_TAG:-仓库初始}\` 之后**

          ## ${TAG_NAME}

          _（更新日志由维护者整理后补充）_

          EOF

          # 找不到前置 tag 时 compare 链接会退化成 "...<tag>" 这类坏链接, 改用提交列表页
          if [ -n "$PREV_TAG" ]; then
            FULL_CHANGELOG="https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${TAG_NAME}"
          else
            FULL_CHANGELOG="https://github.com/${{ github.repository }}/commits/${TAG_NAME}"
          fi

          cat >> "$GITHUB_WORKSPACE/rel_msg.txt" << EOF

          # Version alignment / 版本对齐信息

          **此 Release 发布时对齐的 Commit：** \`$SHORT_HASH\`

          **此 Release 对齐的希沃管家版本：** \`v1.6.7.4010\`

          **🕘 构建时间： $BUILDTIME**

          ---

          **完整更新日志：** \`${FULL_CHANGELOG}\`

          **如果您使用此版本发现了问题，请将此问题反馈至 Issues，并附上图片或复现步骤**
          EOF

          echo "[DEBUG] Generated release notes:"
          cat "$GITHUB_WORKSPACE/rel_msg.txt"

      - name: Upload aura.zip
        uses: actions/upload-artifact@v7
        with:
          name: aura-code
          path: Artifacts/aura.zip

      - name: Upload core.zip
        uses: actions/upload-artifact@v7
        with:
          name: aura-core
          path: Artifacts/core.zip

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ env.TAG_NAME }}" \
            "$GITHUB_WORKSPACE/Artifacts/aura.zip" \
            "$GITHUB_WORKSPACE/Artifacts/core.zip" \
            --title "[Rel]${{ env.TAG_NAME }}" \
            --notes-file "$GITHUB_WORKSPACE/rel_msg.txt" \
            --repo ${{ github.repository }} \
            --latest
