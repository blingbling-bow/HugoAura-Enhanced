name: Versioned Release

# 推送 v* 格式的 tag 时触发, 构建正式版本 Release
on:
  push:
    tags:
      - "v*"

permissions: write-all

jobs:
  release:
    name: Release

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v5
        with:
          path: "./HugoAura-Code"

      - name: Build artifacts
        run: |
          echo "[DEBUG] Creating artifacts directory"
          mkdir -p Artifacts
          cd ./HugoAura-Code/src/aura
          zip -r ../../../Artifacts/aura.zip .
          cd ../core
          zip -r ../../../Artifacts/core.zip .
          cd ../../..

          echo "[DEBUG] Files in <Working DIR>/Artifacts directory:"
          ls -la Artifacts/

      - name: Get tag & commit info
        run: |
          cd ./HugoAura-Code
          TAG_NAME=${GITHUB_REF#refs/tags/}
          SHORT_HASH=$(git rev-parse --short=7 HEAD)
          FULL_HASH=$(git rev-parse HEAD)
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV
          echo "SHORT_HASH=$SHORT_HASH" >> $GITHUB_ENV
          echo "FULL_HASH=$FULL_HASH" >> $GITHUB_ENV
          echo "BUILDTIME=$(TZ=Asia/Shanghai date)" >> $GITHUB_ENV

      - name: Create release content
        run: |
          cat > rel_msg.txt << 'EOF'
          ## HugoAura `${{ env.TAG_NAME }}` 正式发布

          ### 版本类型: 📦 版本发布

          ### 对应 Commit: [`${{ env.SHORT_HASH }}`](https://github.com/${{ github.repository }}/commit/${{ env.FULL_HASH }})

          ---

          ### 更新内容

          - 修复 WS 指令拦截失效问题 (窥屏提醒 / 远程关机拦截 / 云端指令审计)
          - 窥屏检测改为仅提醒模式 (实际采集由独立进程完成, 管家侧拦截无效)
          - 修复 WS 保活窗口创建空引用问题
          - 新增 DPAPI 加密存储支持, 重构密码管理逻辑

          #### 🕘 构建时间: ${{ env.BUILDTIME }}
          EOF

      - name: Upload aura.zip
        uses: actions/upload-artifact@v7
        with:
          name: aura-code
          path: Artifacts/aura.zip

      - name: Upload core.zip
        uses: actions/upload-artifact@v7
        with:
          name: aura-core
          path: Artifacts/core.zip

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ env.TAG_NAME }}" \
            "$GITHUB_WORKSPACE/Artifacts/aura.zip" \
            "$GITHUB_WORKSPACE/Artifacts/core.zip" \
            --title "HugoAura ${{ env.TAG_NAME }}" \
            --notes-file "$GITHUB_WORKSPACE/rel_msg.txt" \
            --repo ${{ github.repository }} \
            --prerelease
