name: Trigger Aura Install static JSON update

on:
  release:
    types: [published]

jobs:
  trigger-dispatch:
    runs-on: ubuntu-latest
    
    # 跳过 pack.yml 产生的 CI 自动构建版本。
    # 注意用 startsWith 而非精确相等: 实际 tag 形如 vAutoBuild-<hash>,
    # 精确比较 'vAutoBuild' 恒为真, 会导致每次 CI 构建都触发 installer 更新。
    if: ${{ !startsWith(github.event.release.tag_name, 'vAutoBuild') }}
    
    steps:
      - name: Trigger repository dispatch
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.AURA_INSTALL_REPO_PAT }}
          repository: blingbling-bow/HugoAura-Enhanced-Install
          event-type: hugoaura_rel
          client-payload: |
            {
              "tag_name": "${{ github.event.release.tag_name }}",
              "release_name": "${{ github.event.release.name }}",
              "release_url": "${{ github.event.release.html_url }}",
              "repository": "${{ github.repository }}"
            }
